<title>Combstruct 30 — konstrukcja</title>
<style>
:root{color-scheme:light;--background:#f6f7f4;--foreground:#203528;--font-size-base:14px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--background);color:var(--foreground)}
*{box-sizing:border-box}body{margin:0}
#comb-krokusy-model{height:100vh;display:flex;flex-direction:column}
#comb-krokusy-model>.viz-row{display:none}
#comb-krokusy-model>.krokusy-stage{position:relative;flex:1;min-height:0;height:auto;width:100%;margin:0;touch-action:none}
#comb-krokusy-model .krokusy-stage canvas{display:block;width:100%;height:100%}
#comb-krokusy-model .krokusy-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--foreground);background:var(--background)}
#comb-krokusy-model .krokusy-loading[hidden]{display:none}
#comb-krokusy-model>.viz-controls{padding:12px 20px 16px}
.form-label{display:flex;align-items:center;gap:12px;font-size:14px}
.form-select{font:inherit;color:inherit;background:#fff;border:1px solid #ccd3cc;border-radius:6px;padding:10px 12px;max-width:100%;flex:1;min-width:0}
.form-select:focus-visible{outline:2px solid #426b4e;outline-offset:3px}
.text-small{font-size:13px}
@media(max-width:480px){#comb-krokusy-model>.viz-controls{padding:10px 12px 14px}.form-select{font-size:16px}}
.batten-toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer}.batten-toggle input{accent-color:#287c78;width:17px;height:17px}
</style>

<div id="comb-krokusy-model">
  <div class="viz-row">
    <span>Combstruct 30</span>
    <span class="text-small text-muted">5,42 × 6,25 m · dach 35°</span>
  </div>
  <div class="krokusy-stage" aria-label="Model konstrukcji domku">
    <div class="krokusy-loading text-small" role="status">Przygotowuję model…</div>
  </div>
  <div class="viz-controls">
    <label class="form-label">Widok
      <select class="form-select" data-view>
        <option value="structure">Cała konstrukcja</option>
        <option value="rear">Od tarasu</option>
        <option value="interior">Wnętrze</option>
        <option value="floor">Płyta podłogowa i taras</option>
        <option value="ceiling">Sufit nad parterem</option>
        <option value="roof">Dach</option>
      </select>
    </label>
    <label class="batten-toggle"><input type="checkbox" data-battens checked> Stelażowanie · łaty 60 × 18 mm</label>
  </div>
</div>
